name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt pytest httpx

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ml-service .

  compose:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build
      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://localhost:8000/health > /dev/null; then
              echo "API is up"; exit 0
            fi
            echo "waiting for API... ($i)"; sleep 3
          done
          echo "API did not become healthy"; docker compose logs; exit 1
      - name: Check Prometheus is running
        run: curl -fs http://localhost:9090/-/healthy
      - name: Tear down
        if: always()
        run: docker compose down
